name: Website build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, website-growth-upgrade-2026-11]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
